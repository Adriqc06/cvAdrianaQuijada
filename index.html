  --pink:#f472b6;--purple:#a78bfa;--grad:linear-gradient(135deg,#be185d,#7c3aed);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--radius:16px;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#faf7fd;--card:#fff;--text:#2a2236;--muted:#6e6580;--border:#e9e1f4;--tag:#f3edfa;--hover:#fbf8fe;

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{

  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);

    radial-gradient(36rem 24rem at -8% 6%,color-mix(in srgb,var(--pink) 14%,transparent),transparent),

  background-repeat:no-repeat;
}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:8px}

/* Navegación */
.nav{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top);

.nav-inner{max-width:1040px;margin:0 auto;padding:10px clamp(12px,4vw,32px);display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-weight:800;text-decoration:none;font-size:.95rem}
.brand-short{display:none}
.nav-right{display:flex;align-items:center;gap:4px}
.nav-links{display:flex;gap:2px}
.nav-links a{text-decoration:none;font-size:.88rem;font-weight:600;color:var(--muted);padding:8px 12px;border-radius:999px;transition:background .2s,color .2s}
.nav-links a:hover{background:var(--tag);color:var(--text)}
.nav-links a[aria-current="page"]{background:color-mix(in srgb,var(--purple) 22%,transparent);color:var(--purple);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--purple) 45%,transparent)}
.nav-links a.cv-btn{background:linear-gradient(135deg,#ec4899,#be185d);color:#fff;margin-left:6px}
.nav-links a.cv-btn:hover{background:linear-gradient(135deg,#ec4899,#be185d);color:#fff;filter:brightness(1.1)}
.icon-btn{font:inherit;font-size:.8rem;font-weight:700;color:var(--text);background:var(--card);border:1px solid var(--border);
  height:36px;min-width:36px;padding:0 10px;border-radius:999px;cursor:pointer;transition:border-color .2s}
.icon-btn:hover{border-color:var(--pink)}
@media (max-width:520px){.brand-full{display:none}.brand-short{display:inline}
  .nav-inner{gap:6px}.nav-links a{padding:8px 9px;font-size:.82rem}.nav-links a.cv-btn{margin-left:2px}}

.container{width:100%;max-width:1040px;margin:0 auto;flex:1;padding:clamp(28px,6vw,64px) clamp(16px,4vw,32px)}
.view{display:none}
.view.active{display:block;animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;margin-bottom:clamp(32px,6vw,56px)}
.avatar{width:clamp(104px,24vw,160px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:5px solid transparent;
  background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--pink),var(--purple)) border-box;box-shadow:var(--shadow)}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;font-weight:800;letter-spacing:-.02em}
.subtitle{color:var(--muted);font-weight:600;font-size:clamp(.95rem,2.4vw,1.15rem);margin-top:10px}

.section-title::after{content:"";display:block;width:48px;height:4px;border-radius:4px;background:var(--grad);margin-top:8px}
.box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(18px,3vw,28px);box-shadow:var(--shadow)}
.box h3{font-size:1rem;font-weight:700;margin-bottom:12px}
.about p{color:var(--muted);max-width:75ch}
.about p+p{margin-top:12px}

.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{--a:var(--purple);background:color-mix(in srgb,var(--a) 15%,transparent);border:1px solid color-mix(in srgb,var(--a) 35%,transparent);

.tag.sm{font-size:.75rem;padding:2px 10px}
.pink .tag,.tag.pink{--a:var(--pink)}

.grid{display:grid;gap:clamp(12px,2vw,20px);grid-template-columns:1fr}
@media (min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:960px){.grid.cols-3{grid-template-columns:repeat(3,1fr)}}

/* Foto con enlace a LinkedIn */
.photo{display:block;position:relative;overflow:hidden;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);
  aspect-ratio:16/10;margin-bottom:clamp(32px,5vw,52px)}

.photo img{width:100%;height:100%;object-fit:cover;transition:transform .4s}

.photo:hover img{transform:scale(1.03)}
.photo-badge{position:absolute;right:14px;bottom:14px;z-index:1;background:var(--grad);color:#fff;font-weight:700;font-size:.85rem;padding:8px 16px;border-radius:999px}

.edu-layout{display:grid;gap:clamp(12px,2vw,20px);grid-template-columns:1fr}

.edu-main{grid-column:1/-1;display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-radius:var(--radius);border:1px solid var(--border);

.edu-icon{width:64px;height:64px;flex:none;display:grid;place-items:center;font-size:1.9rem;border-radius:18px;background:var(--grad);

.edu-main h3{font-size:1.15rem;margin-bottom:2px}
.edu-main p{color:var(--muted);margin-bottom:10px}
.cert-grid{display:grid;gap:10px;grid-template-columns:1fr}

.cert-ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--purple) 22%,transparent)}
.cert:nth-child(even) .cert-ico{background:color-mix(in srgb,var(--pink) 22%,transparent)}
.lang-row+.lang-row{margin-top:18px}
.lang-top{display:flex;justify-content:space-between;font-size:.9rem;font-weight:600;margin-bottom:6px}
.lang-top span:last-child{color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:8px;background:var(--tag);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--grad)}

/* Experiencia */
.timeline{border-left:2px solid transparent;border-image:linear-gradient(var(--pink),var(--purple)) 1;padding-left:clamp(16px,3vw,28px);display:grid;gap:20px}
.job{position:relative}
.job::before{content:"";position:absolute;left:calc(-1 * clamp(16px,3vw,28px) - 7px);top:28px;width:12px;height:12px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 4px var(--bg)}
.job h3{font-size:1.05rem;margin-bottom:2px}
.job .where{color:var(--muted);font-size:.9rem}
.job .when{display:inline-block;margin:8px 0;font-size:.8rem;font-weight:700;color:var(--pink)}
.job ul{margin-left:18px;color:var(--muted);font-size:.92rem}
.job li+li{margin-top:4px}
.job li::marker{color:var(--purple)}

/* Tarjetas */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s,background .2s}
.card:hover{border-color:var(--pink);transform:translateY(-3px);background:var(--hover)}
.card.cta{background:var(--grad);border-color:transparent;color:#fff}
.card.cta .card-desc{color:rgba(255,255,255,.85)}
.card.cta:hover{transform:none}
.cv-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cv-row a{text-decoration:none;font-size:.85rem;font-weight:700;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);padding:6px 14px;border-radius:999px;transition:background .2s}
.cv-row a:hover{background:rgba(255,255,255,.3)}
.card-img{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--tag);margin-bottom:10px}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-title{font-weight:700}
.card-desc{color:var(--muted);font-size:.9rem;flex:1}
.card .tags{margin-top:10px}

/* Detalle */
.back{display:inline-flex;text-decoration:none;font-size:.9rem;font-weight:600;background:var(--card);border:1px solid var(--border);

.back:hover{border-color:var(--pink)}
h2.page-title{font-size:clamp(1.7rem,4.5vw,2.5rem);line-height:1.15;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.lead{margin-bottom:24px}
.box p{color:var(--muted);max-width:70ch}
.gallery{display:grid;gap:clamp(12px,2vw,20px);grid-template-columns:1fr;margin-top:clamp(16px,3vw,24px)}
@media (min-width:900px){.gallery{grid-template-columns:1fr 1fr}}
.media img{width:100%;height:auto;aspect-ratio:2/1;object-fit:cover;border-radius:10px;border:1px solid var(--border)}

footer{text-align:center;font-size:.85rem;color:var(--muted);border-top:1px solid var(--border);padding:20px 16px calc(20px + env(safe-area-inset-bottom))}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

/* ===== Utilidades ===== */
let lang = "es", theme = "dark";
try { lang = localStorage.getItem("lang") || "es"; theme = localStorage.getItem("theme") || "dark"; } catch (e) {}
const $ = id => document.getElementById(id);
const L = v => Array.isArray(v) ? v[lang === "es" ? 0 : 1] : v;
const make = (tag, cls, text) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = text; return el; };
const tagList = (items, cls) => { const w = make("div", "tags " + (cls || "")); items.forEach(t => w.appendChild(make("span", "tag", L(t)))); return w; };

/* ===== Render ===== */
function card(id, p, withImage) {
  const a = make("a", "card"); a.href = "#" + id;
  if (withImage) {
    const box = make("div", "card-img"), img = make("img");
    img.src = p.screenshot.replace("w=700&h=350", "w=500&h=280"); img.alt = L(p.title);
    img.loading = "lazy"; img.width = 500; img.height = 280; box.appendChild(img); a.appendChild(box);
  }
  a.append(make("span", "card-title", p.icon + " " + L(p.title)), make("span", "card-desc", L(p.short)));
  if (withImage) a.appendChild(tagList(p.tags.slice(0, 3)));
  return a;
}

function renderDynamic() {
  $("skills").replaceChildren(...skills.map(([name, items], i) => {
    const b = make("div", "box" + (i % 2 ? " pink" : "")); b.appendChild(make("h3", "", L(name))); b.appendChild(tagList(items)); return b;
  }));
  $("exp").replaceChildren(...jobs.map(j => {
    const d = make("div", "box job");
    d.append(make("h3", "", L(j.role) + " · " + j.org), make("div", "where", L(j.place)), make("span", "when", L(j.when)));
    const ul = make("ul"); j.items.forEach(i => ul.appendChild(make("li", "", L(i)))); d.appendChild(ul); return d;
  }));
  const main = make("div", "edu-main"), txt = make("div"), spec = make("div", "tags pink");
  spec.appendChild(make("span", "tag", L(edu.spec)));
  txt.append(make("h3", "", L(edu.school)), make("p", "", L(edu.degree)), spec);
  main.append(make("div", "edu-icon", "🎓"), txt);
  const c = make("div", "box"), cg = make("div", "cert-grid");
  edu.certs.forEach(([ico, name]) => { const d = make("div", "cert"); d.append(make("span", "cert-ico", ico), make("span", "", L(name))); cg.appendChild(d); });
  c.append(make("h3", "", UI[lang].edu_certs), cg);
  const g = make("div", "box"); g.appendChild(make("h3", "", UI[lang].edu_lang));
  edu.langs.forEach(([name, level, pct]) => {
    const r = make("div", "lang-row"), top = make("div", "lang-top"), bar = make("div", "bar"), i = make("i");
    top.append(make("span", "", L(name)), make("span", "", L(level))); i.style.width = pct + "%"; bar.appendChild(i);
    r.append(top, bar); g.appendChild(r);
  });
  $("edu").replaceChildren(main, c, g);
  $("featured").replaceChildren(...Object.entries(projects).map(([id, p]) => card(id, p, false)));
  $("all-projects").replaceChildren(...Object.entries(projects).map(([id, p]) => card(id, p, true)));
}

function showDetail(p) {
  $("det-title").textContent = p.icon + " " + L(p.title);
  $("det-description").textContent = L(p.desc);
  $("det-diagram").src = p.diagram; $("det-diagram").alt = L(p.title);
  $("det-screenshot").src = p.screenshot; $("det-screenshot").alt = L(p.title);
  $("det-tags").replaceChildren(...p.tags.map(t => make("span", "tag", t)));
}

function applyStatic() {
  document.documentElement.lang = lang;
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = UI[lang][el.dataset.i18n]; });
  $("nav-cv").href = CV[lang];
  document.querySelectorAll("[data-i18n-alt]").forEach(el => { el.alt = UI[lang][el.dataset.i18nAlt]; });
  const bt = $("btn-theme"), bl = $("btn-lang");
  bt.textContent = theme === "dark" ? "☀️" : "🌙";
  bt.setAttribute("aria-label", theme === "dark" ? UI[lang].theme_l : UI[lang].theme_d);
  bl.textContent = lang === "es" ? "EN" : "ES";
  bl.setAttribute("aria-label", UI[lang].lang);
  document.title = lang === "es" ? "Adriana Quijada | Portafolio" : "Adriana Quijada | Portfolio";
}

function route() {
  const key = location.hash.slice(1) || "inicio";
  let view = "view-home", nav = "inicio";
  if (projects[key]) { showDetail(projects[key]); view = "view-detail"; nav = "proyectos"; }
  else if (key === "proyectos") { view = "view-portfolio"; nav = "proyectos"; }
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === view));
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}

function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
$("btn-theme").addEventListener("click", () => { theme = theme === "dark" ? "light" : "dark"; save("theme", theme); applyStatic(); });
$("btn-lang").addEventListener("click", () => { lang = lang === "es" ? "en" : "es"; save("lang", lang); applyStatic(); renderDynamic(); route(); });
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

applyStatic(); renderDynamic(); route();
</script>
