<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14111c;--card:#1d1829;--text:#f1ecf8;--muted:#a99fbd;--border:#2e2740;--tag:#262036;--hover:#241e33;
  --pink:#f472b6;--purple:#a78bfa;--grad:linear-gradient(135deg,#be185d,#7c3aed);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--radius:16px;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#faf7fd;--card:#fff;--text:#2a2236;--muted:#6e6580;--border:#e9e1f4;--tag:#f3edfa;--hover:#fbf8fe;
  --pink:#db2777;--purple:#7c3aed;
  --shadow:0 1px 2px rgba(60,20,100,.05),0 8px 24px rgba(60,20,100,.07);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  background:
    radial-gradient(50rem 28rem at 90% -8%,color-mix(in srgb,var(--purple) 20%,transparent),transparent),
    radial-gradient(36rem 24rem at -8% 6%,color-mix(in srgb,var(--pink) 14%,transparent),transparent),
    var(--bg);
  background-repeat:no-repeat;
}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:8px}

/* Navegación */
.nav{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border)}
.nav-inner{max-width:1040px;margin:0 auto;padding:10px clamp(12px,4vw,32px);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px}
.brand{font-weight:800;text-decoration:none;font-size:.95rem}
.brand-short{display:none}
.nav-right{display:flex;align-items:center;gap:4px}
.nav-links{display:flex;align-items:center;gap:2px}
.nav-links a{white-space:nowrap;text-decoration:none;font-size:.88rem;font-weight:600;color:var(--muted);padding:8px 12px;border-radius:999px;transition:background .2s,color .2s}
.nav-links a:hover{background:var(--tag);color:var(--text)}
.nav-links a[aria-current="page"]{background:color-mix(in srgb,var(--purple) 22%,transparent);color:var(--purple);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--purple) 45%,transparent)}
.cv-s{display:none}
@media (max-width:700px){.cv-l{display:none}.cv-s{display:inline}}
.nav-links a.cv-btn{background:linear-gradient(135deg,#ec4899,#be185d);color:#fff;margin-left:6px}
.nav-links a.cv-btn:hover{background:linear-gradient(135deg,#ec4899,#be185d);color:#fff;filter:brightness(1.1)}
.icon-btn{font:inherit;font-size:.8rem;font-weight:700;color:var(--text);background:var(--card);border:1px solid var(--border);
  height:36px;min-width:36px;padding:0 10px;border-radius:999px;cursor:pointer;transition:border-color .2s}
.icon-btn:hover{border-color:var(--pink)}
@media (max-width:520px){.brand-full{display:none}.brand-short{display:inline}
  .nav-inner{gap:6px}.nav-links a{padding:8px 9px;font-size:.82rem}.nav-links a.cv-btn{margin-left:2px}}

.container{width:100%;max-width:1040px;margin:0 auto;flex:1;padding:clamp(28px,6vw,64px) clamp(16px,4vw,32px)}
.view{display:none}
.view.active{display:block;animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;margin-bottom:clamp(32px,6vw,56px)}
.avatar{width:clamp(110px,30vw,160px);height:auto;aspect-ratio:1;flex:none;border-radius:50%;object-fit:cover;border:5px solid transparent;
  background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--pink),var(--purple)) border-box;box-shadow:var(--shadow)}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.1;font-weight:800;letter-spacing:-.02em}
.role{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px}
.role-main{font-size:clamp(.92rem,3.4vw,1.2rem);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.role-sub{font-size:clamp(.92rem,2.8vw,1.08rem);font-weight:500;color:var(--muted);text-wrap:balance}
@media (min-width:768px){.role{align-items:flex-start}}
.subtitle{color:var(--muted);font-weight:600;font-size:clamp(.95rem,2.4vw,1.15rem);margin-top:10px}
@media (min-width:768px){.hero{flex-direction:row;text-align:left;gap:40px}}

/* Secciones */
.section{margin-bottom:clamp(32px,5vw,52px)}
.section-title{font-size:clamp(1.2rem,2.8vw,1.5rem);font-weight:800;margin-bottom:20px}
.section-title::after{content:"";display:block;width:48px;height:4px;border-radius:4px;background:var(--grad);margin-top:8px}
.box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(18px,3vw,28px);box-shadow:var(--shadow)}
.box h3{font-size:1rem;font-weight:700;margin-bottom:12px}
.about p{color:var(--muted);max-width:75ch}
.about p+p{margin-top:12px}

.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{--a:var(--purple);background:color-mix(in srgb,var(--a) 15%,transparent);border:1px solid color-mix(in srgb,var(--a) 35%,transparent);
  padding:3px 12px;border-radius:999px;font-size:.82rem;font-weight:500}
.tag.sm{font-size:.75rem;padding:2px 10px}
.pink .tag,.tag.pink{--a:var(--pink)}

.grid{display:grid;gap:clamp(12px,2vw,20px);grid-template-columns:1fr}

/* Habilidades */
.skills-legend{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem;margin:-8px 0 18px}
.skills-legend::before{content:"";width:14px;height:14px;border-radius:5px;background:var(--grad)}
.skills-grid{display:grid;gap:clamp(12px,2vw,20px);grid-template-columns:1fr}
@media (min-width:600px){.skills-grid{grid-template-columns:repeat(2,1fr)}.sk-0,.sk-3,.sk-4{grid-column:1/-1}}
@media (min-width:900px){.skills-grid{grid-template-columns:repeat(6,1fr)}.sk-0,.sk-3{grid-column:span 4}.sk-1,.sk-2{grid-column:span 2}}
.skill-card{--a:var(--purple);position:relative;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:clamp(18px,3vw,24px);box-shadow:var(--shadow);transition:border-color .2s}
.skill-card:nth-child(even){--a:var(--pink)}
.skill-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--a),transparent)}
.skill-card:hover{border-color:color-mix(in srgb,var(--a) 60%,var(--border))}
.skill-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.skill-ico{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:1.2rem;border-radius:12px;
  background:color-mix(in srgb,var(--a) 20%,transparent);border:1px solid color-mix(in srgb,var(--a) 35%,transparent)}
.skill-head h3{flex:1;font-size:1.05rem;font-weight:700;margin:0}
.skill-count{font-size:.75rem;font-weight:700;color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent);padding:2px 10px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.84rem;font-weight:500;padding:5px 13px;border-radius:10px;background:var(--tag);border:1px solid var(--border);transition:transform .15s,border-color .15s}
.chip:hover{transform:translateY(-2px);border-color:var(--a)}
.chip.core{background:var(--grad);border-color:transparent;color:#fff;font-weight:600}
@media (min-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:960px){.grid.cols-3{grid-template-columns:repeat(3,1fr)}}

/* Foto con enlace a LinkedIn */
.photo{display:block;position:relative;overflow:hidden;border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);
  aspect-ratio:16/10;margin-bottom:clamp(32px,5vw,52px)}
@media (min-width:768px){.photo{aspect-ratio:21/8}}
.photo img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,color-mix(in srgb,var(--purple) 55%,transparent))}
.photo:hover img{transform:scale(1.03)}
.photo-badge{position:absolute;right:14px;bottom:14px;z-index:1;background:var(--grad);color:#fff;font-weight:700;font-size:.85rem;padding:8px 16px;border-radius:999px}

/* Formación */
.edu-layout{display:grid;gap:clamp(12px,2vw,20px);grid-template-columns:1fr}
@media (min-width:900px){.edu-layout{grid-template-columns:2fr 1fr}}
.edu-main{grid-column:1/-1;display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-radius:var(--radius);border:1px solid var(--border);
  box-shadow:var(--shadow);padding:clamp(18px,3vw,28px);
  background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 14%,var(--card)),color-mix(in srgb,var(--purple) 16%,var(--card)))}
.edu-icon{width:64px;height:64px;flex:none;display:grid;place-items:center;font-size:1.9rem;border-radius:18px;background:var(--grad);
  box-shadow:0 6px 18px color-mix(in srgb,var(--purple) 40%,transparent)}
.edu-main h3{font-size:1.15rem;margin-bottom:2px}
.edu-main p{color:var(--muted);margin-bottom:10px}
.cert-grid{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:600px){.cert-grid{grid-template-columns:repeat(2,1fr)}}
.cert{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--tag);border:1px solid var(--border);font-size:.9rem;font-weight:500}
.cert-ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--purple) 22%,transparent)}
.cert:nth-child(even) .cert-ico{background:color-mix(in srgb,var(--pink) 22%,transparent)}
.lang-row+.lang-row{margin-top:18px}
.lang-top{display:flex;justify-content:space-between;font-size:.9rem;font-weight:600;margin-bottom:6px}
.lang-top span:last-child{color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:8px;background:var(--tag);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--grad)}

/* Experiencia */
.timeline{border-left:2px solid transparent;border-image:linear-gradient(var(--pink),var(--purple)) 1;padding-left:clamp(16px,3vw,28px);display:grid;gap:20px}
.job{position:relative}
.job::before{content:"";position:absolute;left:calc(-1 * clamp(16px,3vw,28px) - 7px);top:28px;width:12px;height:12px;border-radius:50%;background:var(--grad);box-shadow:0 0 0 4px var(--bg)}
.job h3{font-size:1.05rem;margin-bottom:2px}
.job .where{color:var(--muted);font-size:.9rem}
.job .when{display:inline-block;margin:8px 0;font-size:.8rem;font-weight:700;color:var(--pink)}
.job ul{margin-left:18px;color:var(--muted);font-size:.92rem}
.job li+li{margin-top:4px}
.job li::marker{color:var(--purple)}

/* Tarjetas */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .2s,border-color .2s,background .2s}
.card:hover{border-color:var(--pink);transform:translateY(-3px);background:var(--hover)}
.card.cta{background:var(--grad);border-color:transparent;color:#fff}
.card.cta .card-desc{color:rgba(255,255,255,.85)}
.card.cta:hover{transform:none}
.cv-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cv-row a{text-decoration:none;font-size:.85rem;font-weight:700;color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);padding:6px 14px;border-radius:999px;transition:background .2s}
.cv-row a:hover{background:rgba(255,255,255,.3)}
.card-img{aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--tag);margin-bottom:10px}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-title{font-weight:700}
.card-desc{color:var(--muted);font-size:.9rem;flex:1}
.card .tags{margin-top:10px}



/* ===== Detalle profesional de proyectos ===== */

.detail-header {
  margin-bottom: 20px;
}

.detail-category {
  display: inline-block;
  color: var(--pink);
  font-size: .78rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .09em;
  margin-bottom: 12px;
}

.detail-header .page-title {
  margin-bottom: 10px;
}

.detail-role {
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 5px;
}

.detail-period {
  display: inline-block;
  font-size: .82rem;
  color: var(--purple);
  font-weight: 700;
}

.detail-sections {
  display: grid;
  gap: 16px;
  margin-top: 24px;
}

.detail-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: clamp(18px, 3vw, 28px);
  box-shadow: var(--shadow);
}

.detail-box h3 {
  font-size: 1.05rem;
  font-weight: 800;
  margin-bottom: 12px;
}

.detail-box p {
  color: var(--muted);
  max-width: 80ch;
}

.detail-box ul {
  margin-left: 20px;
  color: var(--muted);
}

.detail-box li + li {
  margin-top: 9px;
}

.detail-box li::marker {
  color: var(--purple);
}

.detail-box:nth-child(even) {
  border-left: 3px solid var(--pink);
}

.detail-box:nth-child(odd) {
  border-left: 3px solid var(--purple);
}

#det-gallery-section {
  margin-top: 36px;
}

.gallery {
  display: grid;
  gap: 16px;
  grid-template-columns: 1fr;
}

.gallery-item {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: var(--shadow);
}

.gallery-item img {
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  object-fit: contain;
  border-radius: 10px;
  background: var(--tag);
}

.gallery-caption {
  color: var(--muted);
  font-size: .82rem;
  margin-top: 10px;
}

.detail-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
  text-decoration: none;
  font-weight: 700;
  transition: border-color .2s, transform .2s;
}

.detail-link:hover {
  border-color: var(--pink);
  transform: translateY(-2px);
}

[hidden] {
  display: none !important;
}

@media (min-width: 700px) {
  .gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .detail-sections {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}


/* Detalle */
.back{display:inline-flex;text-decoration:none;font-size:.9rem;font-weight:600;background:var(--card);border:1px solid var(--border);
  padding:8px 16px;border-radius:999px;margin-bottom:24px;transition:border-color .2s}
.back:hover{border-color:var(--pink)}
h2.page-title{font-size:clamp(1.7rem,4.5vw,2.5rem);line-height:1.15;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.lead{margin-bottom:24px}
.box p{color:var(--muted);max-width:70ch}
.gallery{display:grid;gap:clamp(12px,2vw,20px);grid-template-columns:1fr;margin-top:clamp(16px,3vw,24px)}
@media (min-width:900px){.gallery{grid-template-columns:1fr 1fr}}
.media img{width:100%;height:auto;aspect-ratio:2/1;object-fit:cover;border-radius:10px;border:1px solid var(--border)}

footer{text-align:center;font-size:.85rem;color:var(--muted);border-top:1px solid var(--border);padding:20px 16px calc(20px + env(safe-area-inset-bottom))}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ===== Sobre mí: años de experiencia destacados ===== */
.about{display:grid;gap:22px;grid-template-columns:1fr;align-items:center}
@media (min-width:768px){.about{grid-template-columns:auto 1fr;gap:36px}}
.about-years{display:flex;align-items:center;gap:16px;padding:18px 22px;border-radius:14px;border:1px solid color-mix(in srgb,var(--purple) 35%,transparent);
  background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 16%,var(--card)),color-mix(in srgb,var(--purple) 20%,var(--card)))}
@media (min-width:768px){.about-years{flex-direction:column;text-align:center;gap:6px;min-width:200px;padding:28px 24px}}
.about-num{font-size:clamp(3.4rem,13vw,5rem);font-weight:800;line-height:1;letter-spacing:-.03em;
  background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.about-label b{display:block;font-size:1.05rem;font-weight:700;color:var(--text)}
.about-label small{display:block;margin-top:4px;color:var(--muted);font-size:.8rem;line-height:1.4}
@media (min-width:768px){.about-label small{max-width:20ch;margin-inline:auto}}

/* ===== Tarjetas de proyecto (destacados y portafolio) ===== */
.fcard,.pcard{position:relative;display:flex;flex-direction:column;overflow:hidden;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .25s,border-color .25s}
.fcard:hover,.pcard:hover{transform:translateY(-4px);border-color:var(--pink)}
.fcard::before,.pcard::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--grad);z-index:2}
.pimg{position:relative;aspect-ratio:16/10;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--pink) 18%,var(--card)),color-mix(in srgb,var(--purple) 22%,var(--card)))}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.fcard:hover .pimg img,.pcard:hover .pimg img{transform:scale(1.05)}
.pimg-ico{font-size:3rem}
.period-badge{position:absolute;left:12px;bottom:12px;z-index:1;font-size:.75rem;font-weight:700;color:#fff;background:rgba(20,17,28,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18)}
.pbody{display:flex;flex-direction:column;gap:8px;padding:clamp(16px,2.5vw,22px);flex:1}
.pcat{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}
.ptitle{font-size:1.08rem;line-height:1.3;font-weight:800}
.porg{color:var(--muted);font-size:.88rem;font-weight:500}
.pperiod{align-self:flex-start;font-size:.78rem;font-weight:700;color:var(--purple);padding:3px 12px;border-radius:999px;

const $ = id => document.getElementById(id);

const FEATURED = ["project7", "project8", "project9"];

const clean = v => String(L(v) || "").replace(/\s+/g, " ").trim();
const splitTitle = t => { const i = t.indexOf(" | "); return i < 0 ? [t, ""] : [t.slice(0, i), t.slice(i + 3)]; };

function projectCard(id, p, kind) {            // kind: "feat" (inicio) o "list" (portafolio)
  const [title, org] = splitTitle(clean(p.title));
  const a = make("a", kind === "feat" ? "fcard" : "pcard"); a.href = "#" + id;

  const imgBox = make("div", "pimg");
  const fallback = () => imgBox.prepend(make("span", "pimg-ico", p.icon || "📁"));
  if (p.screenshot) {
    const img = make("img"); img.src = p.screenshot; img.alt = title; img.loading = "lazy"; img.width = 640; img.height = 400;
    img.onerror = () => { img.remove(); fallback(); };
    imgBox.appendChild(img);
  } else fallback();
  if (kind === "feat" && p.period) imgBox.appendChild(make("span", "period-badge", "📅 " + clean(p.period)));

  const body = make("div", "pbody");
  if (p.category) body.appendChild(make("span", "pcat", clean(p.category)));
  body.appendChild(make("h3", "ptitle", title));
  if (org) body.appendChild(make("p", "porg", org));
  if (kind === "list" && p.period) body.appendChild(make("span", "pperiod", "📅 " + clean(p.period)));
  body.appendChild(make("p", "pdesc", clean(p.short)));

  const max = kind === "feat" ? 3 : 5, tg = make("div", "tags");
  (p.tags || []).slice(0, max).forEach(t => tg.appendChild(make("span", "tag sm", L(t))));
  if ((p.tags || []).length > max) tg.appendChild(make("span", "tag sm more", "+" + (p.tags.length - max)));
  body.appendChild(tg);
  body.appendChild(make("span", "pcta", UI[lang].view_project + " →"));

  a.append(imgBox, body);
  return a;
}

function card(id, p, withImage) {
  const a = make("a", "card"); a.href = "#" + id;
  if (withImage) {
    const box = make("div", "card-img"), img = make("img");
    img.src = p.screenshot.replace("w=700&h=350", "w=500&h=280"); img.alt = L(p.title);
    img.loading = "lazy"; img.width = 500; img.height = 280; box.appendChild(img); a.appendChild(box);
  }
  a.append(make("span", "card-title", p.icon + " " + L(p.title)), make("span", "card-desc", L(p.short)));
  if (withImage) a.appendChild(tagList(p.tags.slice(0, 3)));
  return a;
}

  const box = make("article", "detail-box");
  box.appendChild(make("h3", "", title));

  if (Array.isArray(content)) {

  $("det-title").textContent = p.icon + " " + L(p.title);
  $("det-category").textContent = L(p.category || "");
  $("det-role").textContent = L(p.role || "");
  $("det-period").textContent = L(p.period || "");

  // Tecnologías
  $("det-tags").replaceChildren(
    ...p.tags.map(t => make("span", "tag", t))
  );

  // Secciones dinámicas
  const sections = $("det-sections");
  sections.replaceChildren();

  addDetailSection(
    sections,
    labels.objective,
    L(p.objective)
  );

  addDetailSection(
    sections,
    labels.solution,
    L(p.solution)
  );

  addDetailSection(
    sections,
    labels.responsibilities,
   localizedContent(p.responsibilities)
  );

  addDetailSection(
    sections,
    labels.architecture,
    L(p.architecture)
  );

  addDetailSection(
    sections,
    labels.results,
    localizedContent(p.results)
  );

  addDetailSection(
    sections,
    labels.overview,
    L(p.desc)
  );

  // Galería de imágenes
  const gallery = $("det-gallery");
  gallery.replaceChildren();

  const images = p.gallery || [p.diagram, p.screenshot];
  const uniqueImages = [...new Set(images.filter(Boolean))];

  uniqueImages.forEach(src => {
    const item = make("div", "gallery-item");
    const img = make("img");

    img.src = src;
    img.alt = L(p.title);
    img.loading = "lazy";

    item.appendChild(img);
    gallery.appendChild(item);
  });

  $("det-gallery-section").hidden = uniqueImages.length === 0;

  // Enlaces externos
  const linksContainer = $("det-links");
  linksContainer.replaceChildren();

  const linkData = p.links || {};

  const linkNames = {
    github: "github",
    demo: "demo",
    documentation: "documentation"
  };

  Object.entries(linkNames).forEach(([key, label]) => {
    const url = linkData[key];

    if (!url) return;

    const a = make("a", "detail-link");
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = "↗ " + labels[label];

    linksContainer.appendChild(a);
  });

  $("det-links-section").hidden =
    linksContainer.children.length === 0;
}


function applyStatic() {
  document.documentElement.lang = lang;
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = UI[lang][el.dataset.i18n]; });
  $("nav-cv").href = CV[lang];
  document.querySelectorAll("[data-i18n-alt]").forEach(el => { el.alt = UI[lang][el.dataset.i18nAlt]; });
  const bt = $("btn-theme"), bl = $("btn-lang");
  bt.textContent = theme === "dark" ? "☀️" : "🌙";
  bt.setAttribute("aria-label", theme === "dark" ? UI[lang].theme_l : UI[lang].theme_d);
  bl.textContent = lang === "es" ? "EN" : "ES";
  bl.setAttribute("aria-label", UI[lang].lang);
  document.title = lang === "es" ? "Adriana Quijada | Portafolio" : "Adriana Quijada | Portfolio";
}

function route() {
  const key = location.hash.slice(1) || "inicio";
  let view = "view-home", nav = "inicio";
  if (projects[key]) { showDetail(projects[key]); view = "view-detail"; nav = "proyectos"; }
  else if (key === "proyectos") { view = "view-portfolio"; nav = "proyectos"; }
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === view));
  document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
}

function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
$("btn-theme").addEventListener("click", () => { theme = theme === "dark" ? "light" : "dark"; save("theme", theme); applyStatic(); });
$("btn-lang").addEventListener("click", () => { lang = lang === "es" ? "en" : "es"; save("lang", lang); applyStatic(); renderDynamic(); route(); });
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

applyStatic(); renderDynamic(); route();
</script>
</body>
</html>
